# orca settings — edit freely, commit with the project.
# format/lint/test: one shell command per key; `off` disables the gate. Delete the stack lines (or the whole file) to re-run auto-discovery.
# planningAgent/codingAgent/reviewAgent (harness[:model]): override the global settings file; a flow's own code overrides both.
# project/plugins.sbt; sbt-scalafmt 2.6.2 is declared here, configured by .scalafmt.conf at repo root (scalafmt 3.11.5). CI does not run a format check.
format = sbt scalafmtAll
# build.sbt; Test/compile is sbt's built-in task (sbt version pinned in project/build.properties); it compiles main and test sources of the aggregated projects (root aggregates client and three, both with -Werror) and executes no tests. The repo has no src/test directories, so it compiles main sources effectively.
lint = sbt Test/compile
# No test sources exist (no src/test directories in modules/ or example/). munit is declared in project/Dependencies.scala (testingLibraryDependencies) but is not applied to any project in build.sbt, and the CI test step (`sbt +test`) in .github/workflows/ci.yml is commented out.
test = off
